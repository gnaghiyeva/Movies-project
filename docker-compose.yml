services:
  backend:
    build:
      context: ./server
    container_name: movies-backend
    env_file:
      - ./server/.env
    restart: unless-stopped
    expose:
      - "9595"
    volumes:
      - ./server/images:/app/images
      - ./server/videos:/app/videos
      - ./server/songs:/app/songs

  frontend:
    build:
      context: ./client
    container_name: movies-frontend
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"

  caddy:
    image: caddy:2-alpine
    container_name: movies-caddy
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config: